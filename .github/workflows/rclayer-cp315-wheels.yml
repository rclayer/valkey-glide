name: rclayer CPython 3.15 wheels

on:
  push:
    tags:
      - "rclayer-cp315-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - runner: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
    runs-on: ${{ matrix.runner }}
    env:
      PROTOC: /tmp/valkey-glide-cp315/local/bin/protoc
      CARGO_PROFILE_RELEASE_STRIP: none
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.15.1"

      - name: Prepare bundled native dependencies on macOS
        if: runner.os == 'macOS'
        run: bash .github/scripts/prepare-cp315-wheel.sh

      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: python/glide-async
          before-script-linux: bash "$GITHUB_WORKSPACE/.github/scripts/prepare-cp315-wheel.sh"
          args: --release --locked --interpreter python3.15 --out ../../dist

      - name: Check wheel imports
        run: |
          python -m pip install "protobuf==6.33.6" dist/*.whl
          python -c "import glide; import glide_shared._fast_response; from glide_shared.protobuf import connection_request_pb2; print(glide.__file__)"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3.0.0
        with:
          name: valkey-glide 2.5.3 (CPython 3.15)
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
